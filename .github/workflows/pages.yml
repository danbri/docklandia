# Publishes docklandia to GitHub Pages (Settings > Pages > Source: "GitHub Actions"): README files and data/ only,
# after tools/check-site.mjs (no file over 100 MB, site under 950 MB, a README.md in each data set) and with a hash
# manifest (manifest.json) for the londat service worker. Runs on a push to main, by hand, or when a data job in this
# repository calls it (workflow_call), so a job that builds bulky data can deploy when it ends.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage README files and data/
        run: |
          mkdir -p _site
          cp README.md _site/
          touch _site/.nojekyll
          if [ -d data ]; then cp -r data _site/; fi
      - name: Check sizes and READMEs; write the hash manifest
        run: node tools/check-site.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
